<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070908" />
    <meta name="description" content="Open HearU and listen together with friends." />
    <title>HearU — Listen together</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070908;
        color: #f7faf8;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 15%, rgba(192, 255, 63, 0.16), transparent 34rem),
          #070908;
      }

      main {
        width: min(90vw, 25rem);
        padding: 2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.35), inset 0 1px rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(24px) saturate(150%);
      }

      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 1.35rem;
        background: #c7ff42;
        color: #10130d;
        font-size: 1.8rem;
        font-weight: 800;
        box-shadow: 0 0 2rem rgba(199, 255, 66, 0.26);
      }

      h1 { margin: 0; font-size: 2rem; letter-spacing: -0.055em; }
      p { margin: 0.75rem 0 1.5rem; color: rgba(247, 250, 248, 0.68); line-height: 1.55; }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.35rem;
        border-radius: 999px;
        background: #c7ff42;
        color: #10130d;
        font-weight: 750;
        text-decoration: none;
      }
    </style>
    <script>
      (() => {
        const destination = new URL('https://hearu-listen-together.akshaey2007.chatgpt.site/');
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">H</div>
      <h1>Opening HearU</h1>
      <p>You’re being taken to the complete listening experience.</p>
      <a href="https://hearu-listen-together.akshaey2007.chatgpt.site/">Open HearU</a>
    </main>
  </body>
</html>
