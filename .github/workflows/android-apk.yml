name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - "app/**"
      - "components/**"
      - "github-pages/**"
      - "vite.github.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Bundle the installed app interface
        run: |
          npm ci
          npm run build:android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK packages
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Build and lint the APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug

      - name: Verify the APK signature
        shell: bash
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-app/app/build/outputs/apk/debug/app-debug.apk'

      - name: Verify the installed app on Android
        shell: bash
        run: bash android-app/verify-emulator.sh

      - name: Upload Android verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HearU-Android-Verification
          path: android-verification/
          retention-days: 14

      - name: Prepare the APK artifact
        shell: bash
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release/HearU-1.1.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HearU-Android-APK
          path: release/HearU-1.1.apk
          if-no-files-found: error
          retention-days: 30
