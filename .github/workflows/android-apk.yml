name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK packages
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Build and lint the APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug :app:lintDebug

      - name: Verify the APK signature
        shell: bash
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-app/app/build/outputs/apk/debug/app-debug.apk'

      - name: Prepare the APK artifact
        shell: bash
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release/HearU-1.0-debug.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HearU-Android-APK
          path: release/HearU-1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
