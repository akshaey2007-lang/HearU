<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HearU — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #f5f7f2;
        background: radial-gradient(circle at 50% 20%, #20261a 0, #070a07 52%);
      }
      main { width: min(100%, 390px); text-align: center; }
      .logo {
        width: 78px;
        height: 78px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        color: #070a07;
        background: #b8ff2c;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -4px;
      }
      h1 { margin: 0 0 12px; font-size: 34px; }
      p { margin: 0 0 28px; color: #b7beb2; line-height: 1.55; }
      a {
        display: block;
        padding: 16px 22px;
        border-radius: 999px;
        color: #070a07;
        background: #b8ff2c;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">|||</div>
      <h1>You’re offline</h1>
      <p>HearU needs an internet connection to open the app and keep listening rooms in sync.</p>
      <a href="https://akshaey2007-lang.github.io/HearU/">Try again</a>
    </main>
  </body>
</html>
